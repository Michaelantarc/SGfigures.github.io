<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG Figures | Colecionáveis Importados</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --whatsapp: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }

    /* Header */
    header { background: var(--card-bg); padding: 1.5rem; text-align: center; border-bottom: 1px solid #334155; }
    header h1 { color: #fff; font-size: 1.8rem; letter-spacing: 1px; }
    header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    /* Layout */
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }

    /* Card do Produto */
    .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #334155; transition: transform 0.2s; position: relative; }
    .card:hover { transform: translateY(-4px); }
    
    .card-img { width: 100%; height: 260px; object-fit: cover; background: #000; }
    
    .badge { position: absolute; top: 12px; right: 12px; background: var(--accent); color: #fff; font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 6px; }

    .card-body { padding: 1.2rem; }
    .title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
    .price { font-size: 1.3rem; font-weight: bold; color: #fff; }

    /* Botão WhatsApp */
    .btn-wa { display: inline-block; width: 100%; text-align: center; background-color: var(--whatsapp); color: #fff; text-decoration: none; padding: 0.75rem; border-radius: 8px; font-weight: bold; margin-top: 1rem; transition: background 0.2s; }
    .btn-wa:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <h1>SG FIGURES</h1>
    <p>Figures 100% Originais Importadas do Japão</p>
  </header>

  <div class="container">
    <div class="grid">

      <!-- Produto 1 -->
      <div class="card">
        <span class="badge">Pronta Entrega</span>
        <img class="card-img" src="https://via.placeholder.com/400x400?text=Albedo+Figure" alt="Albedo">
        <div class="card-body">
          <h2 class="title">Overlord - Albedo</h2>
          <p class="info">Original Japão • Lacrada • 20cm</p>
          <div class="price-row">
            <span class="price">R$ 200,00</span>
          </div>
          <!-- Substiua o DDD e Numero no link abaixo -->
          <a href="https://wa.me/5521999999999?text=Olá!%20Tenho%20interesse%20na%20figure%20da%20Albedo" class="btn-wa" target="_blank">Comprar no WhatsApp</a>
        </div>
      </div>

      <!-- Produto 2 -->
      <div class="card">
        <span class="badge" style="background: #eab308; color: #000;">Encomenda</span>
        <img class="card-img" src="https://via.placeholder.com/400x400?text=Chobits+Chi" alt="Chi">
        <div class="card-body">
          <h2 class="title">Chobits - Chi</h2>
          <p class="info">Escala 1/7 • Na caixa • Importada</p>
          <div class="price-row">
            <span class="price">R$ 1.400,00</span>
          </div>
          <a href="https://wa.me/5521999999999?text=Olá!%20Quero%20consultar%20a%20encomenda%20da%20Chi" class="btn-wa" target="_blank">Consultar no WhatsApp</a>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
